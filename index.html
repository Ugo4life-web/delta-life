<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Life</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071b12;
  color:white;
}
header{
  background:#0d6b3d;
  padding:18px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
}
.container{
  width:92%;
  max-width:700px;
  margin:20px auto;
}
.card{
  background:#10271d;
  border-radius:15px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 4px 15px #0006;
}
input,select,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  border:0;
  font-size:16px;
}
input,select{
  background:white;
  color:#111;
}
button{
  background:#16a05d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#20bd70}
.danger{background:#b83232}
.hidden{display:none}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat{
  background:#173a29;
  padding:12px;
  text-align:center;
  border-radius:10px;
}
.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.menu button{margin:0}
.message{
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  background:#193c2b;
}
.error{background:#642727}
.success{background:#175d38}
.small{
  font-size:13px;
  color:#bbb;
}
h2,h3{margin-top:0}
hr{
  border:0;
  border-top:1px solid #ffffff22;
  margin:15px 0;
}
</style>
</head>

<body>

<header>🌴 DELTA LIFE</header>

<div class="container">

<!-- AUTH -->
<section id="authScreen">

<div class="card">
<h2>🌴 Welcome to Delta Life</h2>
<p class="small">Build your life. Build your future.</p>

<div id="registerBox">

<h3>Create Account</h3>

<input id="regEmail" type="email" placeholder="Email">

<input id="regPassword" type="password" placeholder="Password">

<input id="regUsername" type="text" placeholder="Username">

<input id="regHometown" type="text" placeholder="Hometown">

<select id="regGender">
<option value="">Select Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>

<button onclick="createAccount()">Create Account</button>

<p class="small">
Already have an account?
<button onclick="showLogin()" style="background:none;padding:3px;width:auto">
Login
</button>
</p>

</div>

<div id="loginBox" class="hidden">

<h3>Login</h3>

<input id="loginEmail" type="email" placeholder="Email">

<input id="loginPassword" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p class="small">
Don't have an account?
<button onclick="showRegister()" style="background:none;padding:3px;width:auto">
Create Account
</button>
</p>

</div>

<div id="authMessage"></div>

</div>
</section>


<!-- GAME -->
<section id="gameScreen" class="hidden">

<div class="card">

<h2>🌴 DELTA LIFE</h2>

<p id="welcomeText"></p>

<div class="stats">

<div class="stat">
💰<br>
₦<span id="money">0</span>
</div>

<div class="stat">
⚡<br>
<span id="energy">0</span>
</div>

<div class="stat">
⭐<br>
Level <span id="level">1</span>
</div>

</div>

</div>


<div class="card">

<h3>🧭 Menu</h3>

<div class="menu">

<button onclick="travel()">🗺️ MAP</button>

<button onclick="jobs()">💼 JOBS</button>

<button onclick="home()">🏠 HOME</button>

<button onclick="vehicles()">🚗 VEHICLES</button>

<button onclick="people()">👥 PEOPLE</button>

<button onclick="church()">⛪ CHURCH</button>

<button onclick="club()">🎉 CLUB</button>

<button onclick="hospital()">🏥 HOSPITAL</button>

<button onclick="police()">👮 POLICE</button>

<button onclick="showActivity()">📱 ACTIVITY</button>

</div>

</div>


<div class="card">

<h3>🎮 Game Area</h3>

<div id="gameOutput">
<p>Choose an activity above.</p>
</div>

</div>


<div class="card">

<button class="danger" onclick="logout()">Logout</button>

</div>

</section>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://kwgbrnbmykflgbhxsnkl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KFH_CYFO6sPbKNtNoEjE1A_eIKaRrDC";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   HELPERS
========================= */

function message(text,type=""){
const box=document.getElementById("authMessage");
box.className="message "+type;
box.innerHTML=text;
}

function output(text){
document.getElementById("gameOutput").innerHTML=text;
}

function showLogin(){
document.getElementById("registerBox").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");
message("");
}

function showRegister(){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("registerBox").classList.remove("hidden");
message("");
}


/* =========================
   CREATE ACCOUNT
========================= */

async function createAccount(){

const email =
document.getElementById("regEmail").value.trim();

const password =
document.getElementById("regPassword").value;

const username =
document.getElementById("regUsername").value.trim();

const hometown =
document.getElementById("regHometown").value.trim();

const gender =
document.getElementById("regGender").value;

if(!email || !password || !username || !hometown || !gender){
message("Please fill every box.","error");
return;
}

if(password.length < 6){
message("Password must be at least 6 characters.","error");
return;
}

message("Creating your account...");

try{

const {data,error} =
await supabaseClient.auth.signUp({
email:email,
password:password
});

if(error){
message(error.message,"error");
return;
}

if(!data.user){
message("Account creation failed. Please try again.","error");
return;
}


/* Save profile */

const {error:profileError} =
await supabaseClient
.from("profiles")
.insert({
id:data.user.id,
username:username,
hometown:hometown,
gender:gender,
location:hometown,
money:5000,
energy:100,
level:1,
house:"Delta Life",
vehicle:"None"
});

if(profileError){

/* If profile already exists, continue */

if(!profileError.message.toLowerCase().includes("duplicate")){

message(
"Account was created, but profile setup failed: "+
profileError.message,
"error"
);

return;
}

}


/* If email confirmation is required */

if(!data.session){

message(
"Account created! Check your email to confirm your account, then login.",
"success"
);

showLogin();
return;
}


/* Logged in immediately */

message("Account created successfully!","success");

await loadGame();

}catch(err){

message(
"Something went wrong: "+err.message,
"error"
);

}

}


/* =========================
   LOGIN
========================= */

async function login(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

if(!email || !password){

message("Enter your email and password.","error");
return;

}

message("Logging in...");

try{

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

message(error.message,"error");
return;

}

if(!data.user){

message("Login failed.","error");
return;

}

await ensureProfile(data.user);

await loadGame();

}catch(err){

message(
"Login error: "+err.message,
"error"
);

}

}


/* =========================
   ENSURE PROFILE
========================= */

async function ensureProfile(user){

const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

if(error){
console.log(error);
return;
}

if(data)return;


/* Create profile if missing */

await supabaseClient
.from("profiles")
.insert({
id:user.id,
username:user.email.split("@")[0],
hometown:"Delta State",
gender:"Not specified",
location:"Delta State",
money:5000,
energy:100,
level:1,
house:"Delta Life",
vehicle:"None"
});

}


/* =========================
   LOAD GAME
========================= */

async function loadGame(){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user)return;

await ensureProfile(user);

const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(error){

message(
"Could not load profile: "+error.message,
"error"
);

return;
}

document.getElementById("authScreen")
.classList.add("hidden");

document.getElementById("gameScreen")
.classList.remove("hidden");

document.getElementById("welcomeText").innerHTML =
"Welcome <b>"+escapeHTML(data.username)+"</b> 👋 — "+
escapeHTML(data.hometown);

updateStats(data);

}


/* =========================
   STATS
========================= */

function updateStats(data){

document.getElementById("money").textContent =
Number(data.money||0).toLocaleString();

document.getElementById("energy").textContent =
Number(data.energy||0);

document.getElementById("level").textContent =
Number(data.level||1);

}


/* =========================
   UPDATE PROFILE
========================= */

async function updateProfile(changes){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user)return;

const {data,error} =
await supabaseClient
.from("profiles")
.update(changes)
.eq("id",user.id)
.select()
.single();

if(!error && data){
updateStats(data);
}

}


/* =========================
   ACTIVITY
========================= */

async function logActivity(action){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user)return;

await supabaseClient
.from("activity")
.insert({
user_id:user.id,
action:action
});

}


/* =========================
   MAP
========================= */

async function travel(){

const places=[
"Warri",
"Ughelli",
"Asaba",
"Sapele",
"Kwale",
"Oleh",
"Effurun",
"Agbor"
];

const place =
places[Math.floor(Math.random()*places.length)];

const {data:{user}} =
await supabaseClient.auth.getUser();

const {data} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(!data)return;

if(Number(data.energy)<10){

output("⚡ You are too tired to travel. Visit the hospital or rest at home.");

return;
}

await updateProfile({
location:place,
energy:Number(data.energy)-10
});

await logActivity("Travelled to "+place);

output(
"🗺️ You travelled to <b>"+place+"</b>.<br><br>"+
"⚡ Energy reduced by 10."
);

}


/* =========================
   JOBS
========================= */

async function jobs(){

output(`
<h3>💼 Jobs</h3>

<button onclick="work('Mechanic',1200)">
🔧 Mechanic — ₦1,200
</button>

<button onclick="work('Shop Worker',900)">
🛒 Shop Worker — ₦900
</button>

<button onclick="work('Driver',1500)">
🚕 Driver — ₦1,500
</button>

<button onclick="work('Designer',1800)">
🎨 Designer — ₦1,800
</button>
`);

}


async function work(job,pay){

const {data:{user}} =
await supabaseClient.auth.getUser();

const {data} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(!data)return;

if(Number(data.energy)<10){

output("⚡ You don't have enough energy to work.");

return;
}

await updateProfile({
money:Number(data.money)+pay,
energy:Number(data.energy)-10
});

await logActivity(
"Worked as "+job+" and earned ₦"+pay
);

output(
"💼 You worked as a <b>"+job+
"</b> and earned <b>₦"+
pay.toLocaleString()+
"</b>.<br><br>⚡ Energy -10"
);

}


/* =========================
   HOME
========================= */

async function home(){

output(`
<h3>🏠 Home</h3>

<p>Your current home is <b>Delta Life</b>.</p>

<button onclick="rest()">🛏️ Rest</button>

<button onclick="buyHouse('Comfort House',10000)">
🏡 Buy Comfort House — ₦10,000
</button>

<button onclick="buyHouse('Luxury House',50000)">
🏰 Buy Luxury House — ₦50,000
</button>
`);

}


async function rest(){

const {data:{user}} =
await supabaseClient.auth.getUser();

const {data} =
await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

}


/* =========================
   VEHICLES
========================= */

async function vehicles(){

output(`
<h3>🚗 Vehicles</h3>

<p>Current vehicle: Your profile vehicle</p>

<button onclick="buyVehicle('Motorcycle',8000)">
🏍️ Motorcycle — ₦8,000
</button>

<button onclick="buyVehicle('Car',30000)">
🚗 Car — ₦30,000
</button>

<button onclick="buyVehicle('Luxury Car',100000)">
🏎️ Luxury Car — ₦100,000
</button>
`);

}


async function buyVehicle(vehicle,price){

const {data:{user}} =
await supabaseClient.auth.getUser();

const {data} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(!data)return;

if(Number(data.money)<price){

output("💰 You don't have enough money.");

return;
}

await updateProfile({
vehicle:vehicle,
money:Number(data.money)-price
});

await logActivity(
"Bought a "+vehicle
);

output(
"🚗 You bought a <b>"+vehicle+"</b>."
);

}


/* =========================
   HOUSE PURCHASE
========================= */

async function buyHouse(house,price){

const {data:{user}} =
await supabaseClient.auth.getUser();

const {data} =
await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(!data)return;

if(Number(data.money)<price){

output("💰 You don't have enough money.");

return;
}

await updateProfile({
house:house,
money:Number(data.money)-price
});

await logActivity(
"Bought "+house
);

output(
"🏠 You bought <b>"+house+"</b>."
);

}


/* =========================
   PEOPLE
========================= */

async function people(){

const {data,error} =
await supabaseClient
.from("profiles")
.select("id,username,hometown,gender")
.limit(20);

if(error){

output("Unable to load players right now.");

return;
}

if(!data || data.length===0){

output("No other players found yet.");

return;
}

let html="<h3>👥 People</h3>";

data.forEach(person=>{

html+=`
<div class="message">
<b>${escapeHTML(person.username||"Player")}</b><br>
📍 ${escapeHTML(person.hometown||"Unknown")}<br>
${escapeHTML(person.gender||"")}<br>
</div>
`;

});

output(html);

}


/* =========================
   CHURCH
========================= */

async function church(){

output(`
<h3>⛪ Church</h3>

<p>You entered church.</p>

<button onclick="churchService()">
🙏 Attend Service
</button>
`);

}


async function churchService(){

await logActivity("Attended church service");

output(
"⛪ You attended the church service.<br><br>"+
"🙏 Your spirit is refreshed."
);

}


/* =========================
   CLUB
========================= */

async function club(){

output(`
<h3>🎉 Club</h3>

<p>Welcome to the Delta Life club.</p>

<button onclick="dance()">
🎵 Dance
</button>

<button onclick="leaveClub()">
🚶 Leave Club
</button>
`);

}


async function dance(){

await logActivity("Visited the club and danced");

output(
"🎵 You enjoyed yourself at the club!"
);

}


async function leaveClub(){

output("🚶 You left the club.");

}


/* =========================
   HOSPITAL
========================= */

async function hospital(){

output(`
<h3>🏥 Hospital</h3>

<p>Energy recovery service.</p>

<button onclick="heal()">
💚 Recover Energy — ₦500
</button>
`);

}


async function heal(){

const {data:{user}} =
await supabaseClient.auth.getUser();

const {data} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(!data)return;

if(Number(data.money)<500){

output("💰 You need ₦500.");

return;
}

await updateProfile({
money:Number(data.money)-500,
energy:100
});

await logActivity("Visited the hospital");

output(
"🏥 You recovered your energy to 100."
);

}


/* =========================
   FICTIONAL POLICE GAME
========================= */

async function police(){

output(`
<h3>👮 Police</h3>

<p>Delta Life police station.</p>

<button onclick="policeMission()">
🚓 Start Police Mission
</button>

<p class="small">
This is a fictional game activity.
</p>
`);

}


async function policeMission(){

await logActivity(
"Completed a fictional police mission"
);

output(
"👮 Mission completed!<br><br>"+
"⭐ You gained experience."
);

}


/* =========================
   ACTIVITY
========================= */

async function showActivity(){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user)return;

const {data,error} =
await supabaseClient
.from("activity")
.select("*")
.eq("user_id",user.id)
.order("created_at",{ascending:false})
.limit(20);

if(error){

output("Could not load activity.");

return;
}

let html="<h3>📱 Activity</h3>";

if(!data.length){

html+="<p>No activity yet.</p>";

}else{

data.forEach(item=>{

html+=`
<div class="message">
${escapeHTML(item.action)}
<br>
<span class="small">
${new Date(item.created_at).toLocaleString()}
</span>
</div>
`;

});

}

output(html);

}


/* =========================
   LOGOUT
========================= */

async function logout(){

await supabaseClient.auth.signOut();

document.getElementById("gameScreen")
.classList.add("hidden");

document.getElementById("authScreen")
.classList.remove("hidden");

showRegister();

}


/* =========================
   SECURITY ESCAPE
========================= */

function escapeHTML(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
   CHECK SESSION
========================= */

async function startApp(){

const {data:{session}} =
await supabaseClient.auth.getSession();

if(session){

await loadGame();

}

}

startApp();

</script>

</body>
  </html>
