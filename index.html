<style>
*{
box-sizing:border-box;

body{
margin:0;
font-family:Arial,sans-serif;
background:#071b12;

button{
border:0;

input{

align-items:center;
justify-content:center;

}

.authBox{
width:100%;
max-width:420px;
background:#0c2419;
padding:25px;

.logo{

.subtitle{

.loginBtn{

color:white;
margin-top:10px;

}

#gameScreen{
display:none;
min-height:100vh;
}

.topbar{
background:#0b2a1b;
padding:15px;
position:sticky;
top:0;
z-index:20;
border-bottom:1px solid #1c4d34;
}

.brand{
font-size:25px;
font-weight:bold;
}

.stats{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

.stat{
background:#123724;
padding:8px 12px;
border-radius:10px;
font-size:14px;
}

.container{
padding:15px;

margin:auto;
}

.map{
background:
radial-gradient(circle at 30% 30%,#27784b 0 3%,transparent 4%),
radial-gradient(circle at 70% 60%,#27784b 0 3%,transparent 4%),
#123d28;
border-radius:22px;
padding:20px;
min-height:450px;
position:relative;
overflow:hidden;
border:2px solid #2c744d;
}

.map h2{
text-align:center;
}

.mapSub{
text-align:center;
color:#acd1bb;
}

.cityGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:20px;
}

.city{
background:#174a30;
color:white;
border:1px solid #39805a;
min-height:80px;
}

.city:hover{
background:#216642;
}

.section{
background:#0d281b;
border:1px solid #1d5035;
border-radius:18px;
padding:18px;
margin-top:15px;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.cardBtn{
background:#123a27;
color:white;
border:1px solid #286144;
}

.cardBtn:hover{
background:#1b5134;
}

#output{
margin-top:15px;
}

.message{
background:#123a27;
padding:12px;
border-radius:12px;
margin:7px 0;
}

.danger{
background:#652525;
color:white;
}

.logout{
background:#792929;
color:white;
width:100%;
margin-top:20px;
}

.hidden{
display:none!important;
}

.small{
font-size:13px;
color:#a9cdb9;
}

.success{
color:#62e69a;
}

.error{
color:#ff8c8c;
}

@media(max-width:600px){
.cityGrid{
grid-template-columns:1fr 1fr;
}

.cards{
grid-template-columns:1fr 1fr;
}

.map{
min-height:400px;

<script>

const SUPABASE_URL =
"https://kwgbrnbmykflgbhxsnkl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KFH_CYFO6sPbKNtNoEjE1A";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser = null;
let profile = null;


/* AUTH MESSAGE */

function authMessage(text,type=""){
const box=document.getElementById("authMessage");

box.innerHTML =
"<span class='"+type+"'>"+text+"</span>";
}


/* CREATE ACCOUNT */

async function createAccount(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const username =
document.getElementById("username").value.trim();

const hometown =
document.getElementById("hometown").value.trim();

const gender =
document.getElementById("gender").value;

if(!email || !password || !username || !hometown || !gender){

authMessage(
"Please fill everything.",
"error"
);

return;
}

authMessage("Creating account...");

const {data,error} =
await supabaseClient.auth.signUp({

email:email,
password:password

});

if(error){

authMessage(error.message,"error");
return;

}

if(!data.user){

authMessage(
"Account created. Check your email to verify it.",
"success"
);

return;
}


/* CREATE PROFILE */

const {error:profileError} =
await supabaseClient
.from("profiles")
.insert({

id:data.user.id,
username:username,
hometown:hometown,
gender:gender,
location:hometown,
money:1000000,
energy:100,
level:1,
house:"Delta Starter Home",
vehicle:"None"

});

if(profileError){

authMessage(
"Account created, but profile setup failed: "+
profileError.message,
"error"
);

return;

}

authMessage(
"Account created! Check your email to verify your account.",
"success"
);

}


/* LOGIN */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){

authMessage(
"Enter your email and password.",
"error"
);

return;
}

authMessage("Logging in...");

const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:email,
password:password

});

if(error){

authMessage(error.message,"error");
return;

}

currentUser=data.user;

await loadGame();

}


/* LOAD GAME */

async function loadGame(){

if(!currentUser){

const result =
await supabaseClient.auth.getUser();

currentUser=result.data.user;

}

if(!currentUser){

showAuth();
return;
}


const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.single();

if(error){

authMessage(
"Profile could not be loaded: "+
error.message,
"error"
);

return;
}

profile=data;

document.getElementById("authScreen")
.style.display="none";

document.getElementById("gameScreen")
.style.display="block";

updateDashboard();

}


/* DASHBOARD */

function updateDashboard(){

if(!profile)return;

document.getElementById("welcome")
.innerHTML =
"Welcome "+escapeHTML(profile.username || "Player")+" 👋";

document.getElementById("money")
.textContent =
Number(profile.money || 0).toLocaleString();

document.getElementById("energy")
.textContent =
Number(profile.energy || 0);

document.getElementById("level")
.textContent =
profile.level || 1;

document.getElementById("location")
.textContent =
profile.location || "Delta State";

}


/* UPDATE PROFILE */

async function updateProfile(changes){

if(!currentUser)return;

const {data,error} =
await supabaseClient
.from("profiles")
.update(changes)
.eq("id",currentUser.id)
.select()
.single();

if(error){

showOutput(
"❌ "+escapeHTML(error.message)
);

return null;

}

profile=data;
updateDashboard();

return data;

}


/* TRAVEL */

async function travelTo(place){

if(!profile)return;

const energy =
Number(profile.energy || 0);

if(energy < 10){

showOutput(
"⚡ You need at least 10 energy to travel."
);

return;

}

await updateProfile({

location:place,
energy:energy-10

});

await logActivity(
"Travelled to "+place
);

showOutput(
"🗺️ You travelled to <b>"+
escapeHTML(place)+
"</b>.<br><br>⚡ 10 energy used."
);

}

escapeHTML(job)+

pay.toLocaleString()+
"<br>⚡ 10 energy used."
);

}

/* PEOPLE */

function showPeople(){

showOutput(`
<h2>👥 People</h2>

<p>
Search for another player's username.
</p>

<input id="personSearch"
placeholder="Enter username">

<button type="button"
class="mainBtn"
onclick="searchPeople()">
🔎 Search
</button>

<div id="peopleResults"></div>
`);

}


/* SEARCH PEOPLE */

async function searchPeople(){

const search =
document.getElementById("personSearch")
.value.trim();

if(!search){

showOutput("Enter a username.");

return;

}

const {data,error} =
await supabaseClient
.from("profiles")
.select("id,username,hometown,location,level")
.ilike("username","%"+search+"%")
.limit(10);

if(error){

showOutput(
"❌ Player search is not available yet because of the current profile security settings."
);

return;

}

if(!data || data.length===0){

document.getElementById("peopleResults")
.innerHTML=
"<p>No player found.</p>";

return;

}

document.getElementById("peopleResults")
.innerHTML=
data.map(p=>`

<div class="message">

<b>👤 ${escapeHTML(p.username)}</b><br>

📍 ${escapeHTML(p.location || p.hometown || "Delta State")}
<br>
⭐ Level ${p.level || 1}

<br><br>

<button type="button"
class="cardBtn"
onclick="openChat('${p.id}','${escapeHTML(p.username)}')">
💬 Chat
</button>

</div>

`).join("");

}


/* CHAT PLACEHOLDER */

function openChat(id,name){

showOutput(`

<p>
Private player chat is connected to the
messages system. The chat screen will use
this player's ID:
</p>

${escapeHTML(id)}
</div>

`);

/* ACTIVITY */

async function showActivity(){

.from("activity")
.select("*")
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false})
.limit(20);

if(error){

showOutput(

);

return;

html+="<p>No activity yet.</p>";

.from("activity")
.insert({

user_id:currentUser.id,
action:action

});

/* OUTPUT */

function showOutput(html){

document.getElementById("output").innerHTML=html;

window.scrollTo({
ollHeight,
behavior:"smooth"
});
}
function escapeHTML(value){
return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}
function showAuth(){
document.getElementById("gameScreen").style.display="none";
document.getElementById("authScreen").style.display="flex";
}

async function logout(){
await supabaseClient.auth.signOut();
currentUser=null;
profile=null;
showAuth();
authMessage("Logged out.");
}
async function startApp(){

const {data}=await supabaseClient.auth.getSession();

if(data && data.session){
currentUser=data.session.user;
await loadGame();
}else{
showAuth();
}

}

supabaseClient.auth.onAuthStateChange(
async(event,session)=>{

if(session && !currentUser){
currentUser=session.user;
await loadGame();
}

if(!session){
currentUser=null;
profile=null;
showAuth();
}

});

startApp();

</script>

</body>
</html>
