<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#06140e;
color:white;
}

button,input,select{

}

button{
cursor:pointer;
}

.header{
background:#087443;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:20;
box-shadow:0 4px 18px #0008;
}

.logo{
font-size:22px;
font-weight:bold;
}

.container{
width:94%;
max-width:950px;
margin:auto;
padding:15px 0;
}

.card{
background:#10251b;
border-radius:18px;
padding:17px;
margin-bottom:15px;
box-shadow:0 6px 22px #0006;
border:1px solid #ffffff10;
}

input,
select{
width:100%;
padding:13px;
margin:6px 0;
border:0;
border-radius:10px;
background:white;
color:#111;
}

.btn{
width:100%;
padding:13px;
margin:6px 0;
border:0;
border-radius:10px;
background:#10a968;
color:white;
font-weight:bold;
}

.btn:hover{
background:#13bd75;
}

.btn.dark{
background:#214333;
}

.btn.red{
background:#a83232;
}

.btn.gold{
background:#9b690b;
}

.hidden{
display:none!important;
}

.small{
font-size:13px;
color:#b9c6bf;
}

.message{
padding:11px;
border-radius:10px;
margin-top:10px;
background:#183b2a;
}

.error{
background:#642727;
}

.success{
background:#175d38;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:15px;
}

.stat{
background:#173b2a;
padding:12px 5px;
text-align:center;
border-radius:12px;
}

.stat strong{
display:block;
font-size:18px;
margin-top:4px;
}

.nav{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px;
margin-bottom:14px;
}

.nav button{
border:0;
border-radius:10px;
padding:10px 4px;
background:#143525;
color:white;
font-size:12px;
}

.nav button.active{
background:#10a968;
}

.map{
height:480px;
position:relative;
overflow:hidden;
border-radius:22px;
background:
linear-gradient(135deg,#0b4e35,#11704b 50%,#083d31);
border:2px solid #ffffff18;
}

.map:before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(circle,#ffffff12 2px,transparent 3px);
background-size:45px 45px;
}

.water{
position:absolute;
width:75%;
height:120%;
right:-38%;
top:-10%;
background:#1380a933;
border-radius:50%;
transform:rotate(18deg);
}

.road1,
.road2,
.road3{
position:absolute;
height:11px;
background:#d8a64a35;
border-radius:20px;
}

.road1{
width:90%;
left:4%;
top:48%;
transform:rotate(-12deg);
}

.road2{
width:70%;
left:17%;
top:65%;
transform:rotate(18deg);
}

.road3{
width:65%;
left:8%;
top:30%;
transform:rotate(25deg);
}

.city{
position:absolute;
padding:8px 10px;
border:1px solid #ffffff30;
border-radius:12px;
background:#06281cdd;
color:white;
box-shadow:0 4px 14px #0008;
text-align:left;
}

.city b{
display:block;
font-size:12px;
}

.city span{
font-size:9px;
color:#b8dfc9;
}

.asaba{
top:7%;
left:48%;
}

.agbor{
top:20%;
left:13%;
}

.sapele{
top:36%;
left:23%;
}

.ughelli{
top:49%;
left:30%;
}

.warri{
top:57%;
left:55%;
}

.effurun{
top:44%;
left:73%;
}

.ozoro{
top:67%;
left:64%;
}

.oleh{
top:72%;
left:42%;
}

.kwale{
top:78%;
left:17%;
}

.map-title{
position:absolute;
top:12px;
left:12px;
background:#06140edd;
padding:10px;
border-radius:10px;
font-weight:bold;
}

.map-info{
position:absolute;
bottom:12px;
left:12px;
background:#06140edd;
padding:10px;
border-radius:10px;
font-size:12px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.tile{
background:#173729;
padding:14px;
border-radius:14px;
}

.tile h3{
margin-top:0;
}

.place-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px;
}

.place{
padding:14px;
border:0;
border-radius:13px;
background:#17432f;
color:white;
text-align:left;
}

.place strong{
display:block;
}

.place small{
color:#b8c5be;
}

.activity{
padding:11px;
background:#173729;
border-radius:10px;
margin:7px 0;

@media(max-width:600px){

.map{
height:450px;
}

.city{
padding:6px 8px;
}

.city b{
font-size:10px;
}

.city span{
font-size:8px;
}

.nav{
grid-template-columns:repeat(5,1fr);
}

.grid,
.place-grid{
grid-template-columns:1fr 1fr;
}

}
</style>
</head>

<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://kwgbrnbmykflgbhxsnkl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KFH_CYFO6sPbKNtNoEjE1A_eIKaRrDC";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
PLAYER
===================================================== */

let player = null;


/* =====================================================
HELPERS
===================================================== */

function escapeHTML(value){

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function authMessage(text,type=""){

const box =
document.getElementById("authMessage");

box.className =
"message " + type;

box.innerHTML =
text;

}


function output(html){

document.getElementById(
"gameOutput"
).innerHTML = html;

}


function showLogin(){

document
.getElementById("registerBox")
.classList
.add("hidden");

document
.getElementById("loginBox")
.classList
.remove("hidden");

authMessage("");

}


function showRegister(){

document
.getElementById("loginBox")
.classList
.add("hidden");

document
.getElementById("registerBox")
.classList
.remove("hidden");

authMessage("");

}


/* =====================================================
CREATE ACCOUNT
===================================================== */

async function createAccount(){

const email =
document.getElementById(
"regEmail"
).value.trim();

const password =
document.getElementById(
"regPassword"
).value;

const username =
document.getElementById(
"regUsername"
).value.trim();

const hometown =
document.getElementById(
"regHometown"
).value.trim();

const gender =
document.getElementById(
"regGender"
).value;


if(
!email ||
!password ||
!username ||
!hometown ||
!gender
){

authMessage(
"Please fill every box.",
"error"
);

return;

}


if(password.length < 6){

authMessage(
"Password must be at least 6 characters.",
"error"
);

return;

}


authMessage(
"Creating your account..."
);


const {data,error} =
await supabaseClient.auth.signUp({

email:email,

password:password

});


if(error){

authMessage(
error.message,
"error"
);

return;

}


if(!data.user){

authMessage(
"Account creation failed.",
"error"
);

return;

}


/*
NEW PLAYERS START WITH
₦1,000,000
*/

const {error:profileError} =
await supabaseClient
.from("profiles")
.insert({

id:data.user.id,

username:username,

hometown:hometown,

gender:gender,

location:hometown,

money:1000000,

energy:100,

level:1,

house:"Delta Starter Home",

vehicle:"None"

});


if(
profileError &&
!profileError.message
.toLowerCase()
.includes("duplicate")
){

authMessage(
"Profile setup failed: " +
profileError.message,
"error"
);

return;

}


if(!data.session){

authMessage(
"Account created! Check your email, verify it, then login.",
"success"
);

showLogin();

return;

}


await loadGame();

}


/* =====================================================
LOGIN
===================================================== */

async function login(){

const email =
document.getElementById(
"loginEmail"
).value.trim();

const password =
document.getElementById(
"loginPassword"
).value;


if(!email || !password){

authMessage(
"Enter your email and password.",
"error"
);

return;

}


authMessage(
"Logging in..."
);


const {data,error} =
await supabaseClient.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

authMessage(
error.message,
"error"
);

return;

}


if(!data.user){

authMessage(
"Login failed.",
"error"
);

return;

}


await ensureProfile(
data.user
);

await loadGame();

}


/* =====================================================
ENSURE PROFILE
===================================================== */

async function ensureProfile(user){

const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();


if(data){

player=data;

return;

}


if(error){

console.log(error);

}


await supabaseClient
.from("profiles")
.insert({

id:user.id,

username:
(user.email || "player")
.split("@")[0],

hometown:"Delta State",

gender:"Not specified",

location:"Asaba",

money:1000000,

energy:100,

level:1,

house:"Delta Starter Home",

vehicle:"None"

});


const result =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.single();


player=result.data;

}


/* =====================================================
LOAD GAME
===================================================== */

async function loadGame(){

const {
data:{
user
}
} =
await supabaseClient
.auth
.getUser();


if(!user)return;


await ensureProfile(user);


const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.single();


if(error){

authMessage(
"Could not load profile: " +
error.message,
"error"
);

return;

}


player=data;


document
.getElementById("authScreen")
.classList
.add("hidden");


document
.getElementById("gameScreen")
.classList
.remove("hidden");


document
.getElementById("logoutTop")
.classList
.remove("hidden");


updateStats();


showMap();

}


/* =====================================================
STATS
===================================================== */

function updateStats(){

if(!player)return;


document
.getElementById("welcomeText")
.innerHTML =
"Welcome <b>" +
escapeHTML(player.username) +
"</b> 👋 — " +
escapeHTML(player.location || player.hometown);


document
.getElementById("money")
.textContent =
"₦" +
Number(
player.money || 0
).toLocaleString();


document
.getElementById("energy")
.textContent =
Number(
player.energy || 0
);


document
.getElementById("level")
.textContent =
Number(
player.level || 1
);

}


/* =====================================================
UPDATE PLAYER
===================================================== */

async function updatePlayer(changes){

const {
data,
error
} =
await supabaseClient
.from("profiles")
.update(changes)
.eq("id",player.id)
.select()
.single();


if(!error && data){

player=data;

updateStats();

return true;

}


console.log(error);

return false;

}


/* =====================================================
ACTIVITY
===================================================== */

async function logActivity(action){

if(!player)return;


await supabaseClient
.from("activity")
.insert({

user_id:player.id,

action:action

});

}


/* =====================================================
NAVIGATION
===================================================== */

function resetNav(){

document
.querySelectorAll(".nav button")
.forEach(
button =>
button.classList.remove("active")
);

}


function showMap(){

resetNav();

document
.getElementById("mapNav")
.classList
.add("active");


renderMap();

}


function showJobs(){

resetNav();

document
.getElementById("jobsNav")
.classList
.add("active");


renderJobs();

}


function showHome(){

resetNav();

document
.getElementById("homeNav")
.classList
.add("active");


renderHome();

}


function showPeople(){

resetNav();

document
.getElementById("peopleNav")
.classList
.add("active");


renderPeople();

}


function showMore(){

resetNav();

document
.getElementById("moreNav")
.classList
.add("active");


renderMore();

}

class="city effurun"

</div>


<div class="card">

<div class="place-grid">

onclick="university()">

}


/* =====================================================
TRAVEL
===================================================== */

async function travelTo(place){

if(
player.location === place
){

alert(
"You are already in " +
place
);

return;

}


if(
Number(player.energy) < 10
){

alert(
"You need at least 10 energy to travel."
);

return;

}


await updatePlayer({

location:place,

energy:
Number(player.energy) - 10

});


await logActivity(
"Travelled to " +
place
);


showMap();

}

async function rest(){

await updatePlayer({
energy:100
});


await logActivity(
"Rested at home"
);

);

}


async function buyHouse(
house,
price
){

Number(player.money) < price
){

alert(
"💰 You don't have enough money."
);

return;

}


await updatePlayer({

house:house,

money:
Number(player.money) - price

});

);
