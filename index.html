<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://kwgbrnbmykflgbhxsnkl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KFH_CYFO6sPbKNtNoEjE1A_eIKaRrDC";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   HELPERS
========================= */

function message(text,type=""){
const box=document.getElementById("authMessage");
box.className="message "+type;
box.innerHTML=text;
}

function output(text){
document.getElementById("gameOutput").innerHTML=text;
}

function showLogin(){
document.getElementById("registerBox").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");
message("");
}

function showRegister(){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("registerBox").classList.remove("hidden");
message("");
}


/* =========================
   CREATE ACCOUNT
========================= */

async function createAccount(){

const email =
document.getElementById("regEmail").value.trim();

const password =
document.getElementById("regPassword").value;

const username =
document.getElementById("regUsername").value.trim();

const hometown =
document.getElementById("regHometown").value.trim();

const gender =
document.getElementById("regGender").value;

if(!email || !password || !username || !hometown || !gender){
message("Please fill every box.","error");
return;
}

if(password.length < 6){
message("Password must be at least 6 characters.","error");
return;
}

message("Creating your account...");

try{

const {data,error} =
await supabaseClient.auth.signUp({
email:email,
password:password
});

if(error){
message(error.message,"error");
return;
}

if(!data.user){
message("Account creation failed. Please try again.","error");
return;
}


/* Save profile */

const {error:profileError} =
await supabaseClient
.from("profiles")
.insert({
id:data.user.id,
username:username,
hometown:hometown,
gender:gender,
location:hometown,
money:5000,
energy:100,
level:1,
house:"Delta Life",
vehicle:"None"
});

if(profileError){

/* If profile already exists, continue */

if(!profileError.message.toLowerCase().includes("duplicate")){

message(
"Account was created, but profile setup failed: "+
profileError.message,
"error"
);

return;
}

}


/* If email confirmation is required */

if(!data.session){

message(
"Account created! Check your email to confirm your account, then login.",
"success"
);

showLogin();
return;
}


/* Logged in immediately */

message("Account created successfully!","success");

await loadGame();

}catch(err){

message(
"Something went wrong: "+err.message,
"error"
);

}

}


/* =========================
   LOGIN
========================= */

async function login(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

if(!email || !password){

message("Enter your email and password.","error");
return;

}

message("Logging in...");

try{

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

message(error.message,"error");
return;

}

if(!data.user){

message("Login failed.","error");
return;

}

await ensureProfile(data.user);

await loadGame();

}catch(err){

message(
"Login error: "+err.message,
"error"
);

}

}


/* =========================
   ENSURE PROFILE
========================= */

async function ensureProfile(user){

const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

if(error){
console.log(error);
return;
}

if(data)return;


/* Create profile if missing */

await supabaseClient
.from("profiles")
.insert({
id:user.id,
username:user.email.split("@")[0],
hometown:"Delta State",
gender:"Not specified",
location:"Delta State",
money:5000,
energy:100,
level:1,
house:"Delta Life",
vehicle:"None"
});

}


/* =========================
   LOAD GAME
========================= */

async function loadGame(){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user)return;

await ensureProfile(user);

const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(error){

message(
"Could not load profile: "+error.message,
"error"
);

return;
}

document.getElementById("authScreen")
.classList.add("hidden");

document.getElementById("gameScreen")
.classList.remove("hidden");

document.getElementById("welcomeText").innerHTML =
"Welcome <b>"+escapeHTML(data.username)+"</b> 👋 — "+
escapeHTML(data.hometown);

updateStats(data);

}


/* =========================
   STATS
========================= */

function updateStats(data){

document.getElementById("money").textContent =
Number(data.money||0).toLocaleString();

document.getElementById("energy").textContent =
Number(data.energy||0);

document.getElementById("level").textContent =
Number(data.level||1);

}


/* =========================
   UPDATE PROFILE
========================= */

async function updateProfile(changes){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user)return;

const {data,error} =
await supabaseClient
.from("profiles")
.update(changes)
.eq("id",user.id)
.select()
.single();

if(!error && data){
updateStats(data);
}

}


/* =========================
   ACTIVITY
========================= */

async function logActivity(action){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user)return;

await supabaseClient
.from("activity")
.insert({
user_id:user.id,
action:action
});

}

/* =========================
   SECURITY ESCAPE
========================= */

function escapeHTML(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

   CHECK SESSION
========================= */

await supabaseClient.auth.getSession();

if(session){

await loadGame();

}

}

startApp();

  `;

  document.head.appendChild(style);

  function makeCard(icon, title, text, className, action) {
    const card = document.createElement("div");
    card.className = "delta-card " + className;

    card.innerHTML = `
      <div class="icon">${icon}</div>
      <div class="title">${title}</div>
      <div class="small">${text}</div>
    `;

    card.onclick = action;

    return card;
  }

  function createUpgrade() {

    if (document.getElementById("deltaUpgrade")) return;

    const gameArea =
      document.querySelector("#gameScreen") ||
      document.querySelector(".game-screen") ||
      document.body;

    const box = document.createElement("div");
    box.id = "deltaUpgrade";

    box.innerHTML = `
      <div class="delta-welcome">
        <h2>🌴 Welcome to Delta Life</h2>
        <p>Live your life. Make money. Explore Delta State.</p>

        <div class="delta-stats">
          <div class="delta-stat">
            💰
            <strong id="upgradeMoney">₦0</strong>
            Money
          </div>

          <div class="delta-stat">
            ⚡
            <strong id="upgradeEnergy">0</strong>
            Energy
          </div>

          <div class="delta-stat">
            ⭐
            <strong id="upgradeLevel">1</strong>
            Level
          </div>
        </div>
      </div>

      <div class="delta-section-title">🌴 What do you want to do?</div>

      <div class="delta-grid" id="deltaCards"></div>
    `;

    gameArea.appendChild(box);

    const cards = document.getElementById("deltaCards");

    cards.appendChild(
      makeCard(
        "🗺️",
        "Explore Delta",
        "Travel around Delta State",
        "map-card",
        () => {
          if (typeof map === "function") map();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "💼",
        "Jobs",
        "Work and earn money",
        "job-card",
        () => {
          if (typeof jobs === "function") jobs();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "🏠",
        "My Home",
        "Manage your home",
        "home-card",
        () => {
          if (typeof home === "function") home();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "🚗",
        "Vehicles",
        "Check your vehicles",
        "vehicle-card",
        () => {
          if (typeof vehicles === "function") vehicles();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "👥",
        "People",
        "Meet other players",
        "people-card",
        () => {
          if (typeof people === "function") people();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "⛪",
        "Church",
        "Visit church",
        "church-card",
        () => {
          if (typeof church === "function") church();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "🎉",
        "Club",
        "Enjoy the nightlife",
        "club-card",
        () => {
          if (typeof club === "function") club();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "🏥",
        "Hospital",
        "Take care of your health",
        "hospital-card",
        () => {
          if (typeof hospital === "function") hospital();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "👮",
        "Police",
        "Police station",
        "police-card",
        () => {
          if (typeof police === "function") police();
        }
      )
    );

    cards.appendChild(
      makeCard(
        "📱",
        "Activity",
        "See what you've done",
        "activity-card",
        () => {
          if (typeof activity === "function") activity();
        }
      )
    );
  }

  function updateUpgradeStats() {

    const money = document.getElementById("upgradeMoney");
    const energy = document.getElementById("upgradeEnergy");
    const level = document.getElementById("upgradeLevel");

    if (money && typeof player !== "undefined") {
      if (player.money !== undefined)
        money.textContent = "₦" + Number(player.money).toLocaleString();
    }

    if (energy && typeof player !== "undefined") {
      if (player.energy !== undefined)
        energy.textContent = player.energy;
    }

    if (level && typeof player !== "undefined") {
      if (player.level !== undefined)
        level.textContent = player.level;
    }
  }

  const watcher = new MutationObserver(function () {

    const text = document.body.innerText || "";

    if (
      text.includes("Welcome") &&
      !document.getElementById("deltaUpgrade")
    ) {
      setTimeout(createUpgrade, 300);
    }

    updateUpgradeStats();
  });

  watcher.observe(document.body, {
    childList: true,
    subtree: true
  });

})();  
</script>

</body>
  </html>
